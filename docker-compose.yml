services:
  api:
    build: ./apps/api
    environment:
      APP_ENV: development
      API_PORT: 8000
      DATABASE_URL: sqlite:////data/supplierlens.db
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 10
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - supplierlens_web_node_modules_v02:/app/node_modules
      - supplierlens_web_next_v02:/app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      - api

volumes:
  supplierlens_web_node_modules_v02:
  supplierlens_web_next_v02:
